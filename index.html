<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><meta name="mobile-web-app-capable" content="yes"><title>Teleprompter</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#050505;color:white}button,input,textarea{font:inherit}button{background:#292929;color:white;border:1px solid #666;border-radius:8px;padding:9px 12px}button.active{background:#16557b}button:focus-visible{outline:2px solid #80caff}header{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:#181818;padding:10px;border-bottom:1px solid #444}label{font-size:13px;display:flex;gap:5px;align-items:center}input[type=range]{width:95px}#editarea{padding:10px;background:#141414}textarea{display:block;width:100%;min-height:115px;resize:vertical;background:#202020;color:white;border:1px solid #666;border-radius:8px;padding:10px}#help,#diagnostic,#stats{font-size:12px;color:#bbb}#help{line-height:1.5;margin-top:8px}#diagnostic{color:#8dd0ff}#stage{position:relative;height:calc(100dvh - 285px);min-height:250px;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}#stage::-webkit-scrollbar{display:none}#script{width:85%;margin:auto;padding:30vh 10px 75vh;white-space:pre-wrap;overflow-wrap:break-word;font-size:48px;line-height:1.4;font-weight:600}#stage.flip-x #script{transform:scaleX(-1)}#stage.flip-y #script{transform:scaleY(-1)}#stage.flip-x.flip-y #script{transform:scale(-1,-1)}#exit{min-width:78px;min-height:48px;background:#222e;border:1px solid #aaa;border-radius:12px}#editarea.collapsed textarea,#editarea.collapsed #help,#editarea.collapsed p{display:none}#guide{position:sticky;top:36%;height:2px;background:#e66;opacity:0;pointer-events:none;z-index:2}#guide.show{opacity:.7}body.present header,body.present #editarea{display:none}body.present #stage{height:100dvh;height:100svh;min-height:100svh}#exit{display:none;position:fixed;right:9px;top:9px;z-index:3;opacity:.2}body.present #exit{display:block;opacity:.8}#exit:focus,#exit:active{opacity:1}@media(max-width:650px){#stage{height:calc(100dvh - 350px)}}
</style></head><body>
<header><button id="play">▶ Play</button><button id="reset">↺ Start</button><button id="mx">Mirror X: Off</button><button id="my">Mirror Y: Off</button><button id="guideBtn">Guide: Off</button><button id="full">Full screen</button><button id="editToggle">Hide script editor</button><label>Speed <input type="range" id="speed" min="0" max="240" value="45"><output id="speedValue">45</output></label><label>Font <input type="range" id="font" min="24" max="120" value="48"><output id="fontValue">48</output></label><label>Width <input type="range" id="width" min="35" max="100" value="85"><output id="widthValue">85</output>%</label><label>Spacing <input type="range" id="spacing" min="1" max="2.2" step=".1" value="1.4"><output id="spacingValue">1.4</output></label><span id="stats"></span></header>
<section id="editarea"><textarea id="editor" aria-label="Script"></textarea><div id="help">Space / Enter: play/pause · ← / →: speed −/+ · ↑ / ↓: scroll · Page Up / Down: larger scroll · Home: start · M: mirror horizontally · F: full screen · Esc: exit. Tap the reading area to pause/play in full screen. Stored locally, not uploaded.</div><p><button id="test">Remote tester: Off</button> <span id="diagnostic" aria-live="polite"></span></p></section>
<main id="stage" tabindex="0" aria-label="Reading area"><div id="guide"></div><div id="script"></div></main><button id="exit">Exit</button>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),stage=$('stage'),script=$('script'),editor=$('editor');
function read(k,fallback){try{return localStorage.getItem(k)??fallback}catch{return fallback}}function save(k,v){try{localStorage.setItem(k,v)}catch{}}
let prefs;try{prefs={speed:45,font:48,width:85,spacing:1.4,mx:false,my:false,guide:false,...JSON.parse(read('tp-settings','{}'))}}catch{prefs={speed:45,font:48,width:85,spacing:1.4,mx:false,my:false,guide:false}}
const persist=()=>save('tp-settings',JSON.stringify(prefs));let playing=false,frame=0,last=0,testing=false;
editor.value=read('tp-script','Paste your script here.\n\nEnable Mirror X to read through the beam-splitter glass.\n\nPress Space or Enter to play or pause.');
function refresh(){script.textContent=editor.value;const n=editor.value.trim().split(/\s+/).filter(Boolean).length;$('stats').textContent=n+' words · about '+Math.ceil(n/140*60)+' seconds';save('tp-script',editor.value)}editor.addEventListener('input',refresh);refresh();
function draw(){stage.classList.toggle('flip-x',prefs.mx);stage.classList.toggle('flip-y',prefs.my);$('guide').classList.toggle('show',prefs.guide);for(const [id,key,title] of [['mx','mx','Mirror X'],['my','my','Mirror Y'],['guideBtn','guide','Guide']]){$(id).textContent=title+': '+(prefs[key]?'On':'Off');$(id).classList.toggle('active',prefs[key])}script.style.fontSize=prefs.font+'px';script.style.width=prefs.width+'%';script.style.lineHeight=prefs.spacing;for(const key of ['speed','font','width','spacing']){$(key).value=prefs[key];$(key+'Value').textContent=prefs[key]}}
$('editToggle').onclick=()=>{const hidden=$('editarea').classList.toggle('collapsed');$('editToggle').textContent=hidden?'Show script editor':'Hide script editor';save('tp-editor-hidden',hidden?'1':'0')};if(read('tp-editor-hidden','0')==='1')$('editToggle').click();draw();for(const key of ['speed','font','width','spacing'])$(key).oninput=()=>{prefs[key]=Number($(key).value);persist();draw()};
for(const [id,key] of [['mx','mx'],['my','my'],['guideBtn','guide']])$(id).onclick=()=>{prefs[key]=!prefs[key];if(key==='my'){pause();stage.scrollTop=prefs.my?stage.scrollHeight:0}persist();draw()};
function pause(){playing=false;cancelAnimationFrame(frame);last=0;$('play').textContent='▶ Play'}
function adjustSpeed(delta){prefs.speed=Math.max(0,Math.min(240,prefs.speed+delta));persist();draw()}function move(delta){stage.scrollTop+=prefs.my?-delta:delta}function tick(t){if(!playing)return;if(last){const before=stage.scrollTop;move((t-last)/1000*prefs.speed);if(stage.scrollTop===before&&prefs.speed>0)pause()}last=t;if(playing)frame=requestAnimationFrame(tick)}
function toggle(){if(playing)pause();else{playing=true;last=0;$('play').textContent='Ⅱ Pause';frame=requestAnimationFrame(tick)}}
$('play').onclick=toggle;$('reset').onclick=()=>{pause();stage.scrollTop=prefs.my?stage.scrollHeight:0};
async function exit(){document.body.classList.remove('present');if(document.fullscreenElement)try{await document.exitFullscreen()}catch{}}
async function fullscreen(){if(document.body.classList.contains('present'))return exit();document.body.classList.add('present');stage.focus({preventScroll:true});if(document.documentElement.requestFullscreen)try{await document.documentElement.requestFullscreen()}catch{}}
$('full').onclick=fullscreen;$('exit').onclick=exit;stage.addEventListener('click',()=>{if(document.body.classList.contains('present'))toggle()});
$('test').onclick=()=>{testing=!testing;$('test').textContent='Remote tester: '+(testing?'On':'Off');$('diagnostic').textContent=testing?'Press a Desview remote button…':''};
document.addEventListener('keydown',e=>{if((e.key==='Unidentified'||e.keyCode===0)&&!testing){e.preventDefault();e.stopPropagation();if(!e.repeat)toggle();return}if(testing){$('diagnostic').textContent='Key: '+JSON.stringify(e.key)+' | code: '+e.code+' | keyCode: '+e.keyCode;e.preventDefault();return}if(e.target===editor||e.target.tagName==='INPUT')return;let handled=true;switch(e.key){case ' ':case 'Enter':case 'MediaPlayPause':toggle();break;case 'ArrowRight':adjustSpeed(5);break;case 'ArrowLeft':adjustSpeed(-5);break;case 'ArrowDown':move(55);break;case 'ArrowUp':move(-55);break;case 'PageDown':move(stage.clientHeight*.55);break;case 'PageUp':move(-stage.clientHeight*.55);break;case 'Home':stage.scrollTop=prefs.my?stage.scrollHeight:0;break;case 'm':case 'M':$('mx').click();break;case 'f':case 'F':fullscreen();break;case 'Escape':exit();break;default:handled=false}if(handled){e.preventDefault();e.stopPropagation()}} ,true);
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('present')});window.addEventListener('pagehide',pause);
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
