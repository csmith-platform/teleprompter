<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><meta name="mobile-web-app-capable" content="yes"><title>Teleprompter</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#050505;color:white}button,input,textarea{font:inherit}button{background:#292929;color:white;border:1px solid #666;border-radius:8px;padding:9px 12px}button.active{background:#16557b}button:focus-visible{outline:2px solid #80caff}header{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:#181818;padding:10px;border-bottom:1px solid #444}label{font-size:13px;display:flex;gap:5px;align-items:center}input[type=range]{width:95px}#editarea{padding:10px;background:#141414}textarea{display:block;width:100%;min-height:115px;resize:vertical;background:#202020;color:white;border:1px solid #666;border-radius:8px;padding:10px}#help,#diagnostic,#stats{font-size:12px;color:#bbb}#help{line-height:1.5;margin-top:8px}#diagnostic{color:#8dd0ff}#stage{position:relative;height:calc(100dvh - 285px);min-height:250px;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}#stage::-webkit-scrollbar{display:none}#script{width:85%;margin:auto;padding:30vh 10px 75vh;white-space:pre-wrap;overflow-wrap:break-word;font-size:48px;line-height:1.4;font-weight:600}#stage.flip-x #script{transform:scaleX(-1)}#stage.flip-y #script{transform:scaleY(-1)}#stage.flip-x.flip-y #script{transform:scale(-1,-1)}#exit{min-width:78px;min-height:48px;background:#222e;border:1px solid #aaa;border-radius:12px}#editarea.collapsed textarea,#editarea.collapsed #help,#editarea.collapsed p{display:none}#guide{position:fixed;top:var(--guide-position,50%);left:0;right:0;height:2px;background:#e66;opacity:0;pointer-events:none;z-index:2;transform:translateY(-50%)}#guide.show{opacity:.7}#guideControl{position:fixed;z-index:5;left:4px;bottom:calc(2% + 52px);top:auto;transform:none;height:40vh;height:40dvh;width:42px;padding:12px 5px;display:flex;align-items:center;justify-content:center;background:#222b;border:1px solid #aaa8;border-radius:12px;opacity:.65}#guideCorner{position:fixed;z-index:6;left:4px;bottom:2%;min-width:64px;min-height:44px;background:#222e;border:1px solid #aaa8;opacity:.2}#guideCorner.active{background:#222e;opacity:.35}#guideCorner:focus-visible,#guideCorner:active{opacity:1}#guideControl:focus-within,#guideControl:hover{opacity:1}#guideVertical{writing-mode:vertical-lr;direction:ltr;appearance:slider-vertical;width:30px;height:100%;accent-color:#ddd;cursor:pointer}#guideControl.hidden{display:none}body.camera-mode #stage{background:transparent}body.camera-mode #script{text-shadow:0 2px 8px #000,0 0 5px #000}#cameraPreview{display:none;position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}body.camera-mode #cameraPreview{display:block}body.camera-mode #cameraPreview.fit{object-fit:contain}#cameraFrame{display:none;position:fixed;inset:0;pointer-events:none;z-index:0}body.camera-mode #cameraFrame{display:block}#cameraFrame::after{content:'';position:absolute;inset:0;border:2px solid #ffffff88;pointer-events:none}#cameraFrame.r916{inset:0 calc((100vw - min(100vw,100dvh * 9 / 16))/2)}#cameraFrame.r169{top:calc((100dvh - min(100dvh,100vw * 9 / 16))/2);bottom:calc((100dvh - min(100dvh,100vw * 9 / 16))/2)}#cameraFrame.r11{inset:max(0px,calc((100dvh - 100vw)/2)) max(0px,calc((100vw - 100dvh)/2))}#cameraStatus{font-size:12px;color:#ddd}#record.active{background:#a31e28}body.present #cameraPreview{z-index:-1}body.present header,body.present #editarea{display:none}body.present #stage{height:100dvh;height:100svh;min-height:100svh}body.present #script{padding-top:calc(var(--guide-position,50svh) - .7em);padding-bottom:calc(100svh - var(--guide-position,50svh) - .7em)}#exit{display:none;position:fixed;right:9px;top:9px;z-index:3;opacity:.2}body.present #exit{display:block;opacity:.8}#exit:focus,#exit:active{opacity:1}@media(max-width:650px){#stage{height:calc(100dvh - 350px)}}
</style></head><body>
<header><button id="play">▶ Play</button><button id="reset">↺ Start</button><button id="mx">Mirror X: Off</button><button id="my">Mirror Y: Off</button><button id="guideBtn">Guide: Off</button><button id="full">Full screen</button><button id="camera">Camera: Off</button><button id="record" disabled>● Record</button><button id="switchCamera" disabled>Flip camera</button><label>Format <select id="videoRatio"><option value="9:16">9:16</option><option value="16:9">16:9</option><option value="1:1">1:1</option><option value="4:3">4:3</option></select></label><label>Quality <select id="videoQuality"><option value="720">720p</option><option value="1080" selected>1080p</option><option value="2160">4K (if supported)</option></select></label><label>Preview <select id="videoFit"><option value="cover">Fill / crop</option><option value="contain">Fit / letterbox</option></select></label><span id="cameraStatus" aria-live="polite"></span><button id="editToggle">Hide script editor</button><label>Speed <input type="range" id="speed" min="0" max="240" value="45"><output id="speedValue">45</output></label><label>Font <input type="range" id="font" min="24" max="120" value="48"><output id="fontValue">48</output></label><label>Width <input type="range" id="width" min="35" max="100" value="85"><output id="widthValue">85</output>%</label><label>Spacing <input type="range" id="spacing" min="1" max="2.2" step=".1" value="1.4"><output id="spacingValue">1.4</output></label><span id="stats"></span></header>
<section id="editarea"><textarea id="editor" aria-label="Script"></textarea><div id="help">Space / Enter: play/pause · ← / →: speed −/+ · ↑ / ↓: scroll · Page Up / Down: larger scroll · Home: start · M: mirror horizontally · F: full screen · Esc: exit. Tap the reading area to pause/play in full screen. Stored locally, not uploaded.</div><p><button id="test">Remote tester: Off</button> <span id="diagnostic" aria-live="polite"></span></p></section>
<video id="cameraPreview" autoplay muted playsinline></video><div id="cameraFrame" aria-hidden="true"></div><button id="guideCorner" type="button" aria-pressed="false" aria-label="Show or hide guide position slider">Slider</button><div id="guideControl" aria-label="Guide position"><input id="guideVertical" type="range" min="15" max="95" step="1" value="50" aria-label="Move reading guide vertically"></div><main id="stage" tabindex="0" aria-label="Reading area"><div id="guide"></div><div id="script"></div></main><button id="exit">Exit</button>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),stage=$('stage'),script=$('script'),editor=$('editor');
function read(k,fallback){try{return localStorage.getItem(k)??fallback}catch{return fallback}}function save(k,v){try{localStorage.setItem(k,v)}catch{}}
let prefs;try{prefs={speed:45,font:48,width:85,spacing:1.4,mx:false,my:false,guide:false,sliderVisible:false,guidePosition:50,...JSON.parse(read('tp-settings','{}'))}}catch{prefs={speed:45,font:48,width:85,spacing:1.4,mx:false,my:false,guide:false,sliderVisible:false,guidePosition:50}}
const persist=()=>save('tp-settings',JSON.stringify(prefs));let playing=false,frame=0,last=0,testing=false;let cameraStream=null,recorder=null,chunks=[],facing='user',recordStream=null,recordCanvas=null,recordFrame=0;const cameraPrefs={ratio:read('tp-video-ratio','9:16'),quality:read('tp-video-quality','1080'),fit:read('tp-video-fit','cover')};
editor.value=read('tp-script','Paste your script here.\n\nEnable Mirror X to read through the beam-splitter glass.\n\nPress Space or Enter to play or pause.');
function refresh(){script.textContent=editor.value;const n=editor.value.trim().split(/\s+/).filter(Boolean).length;$('stats').textContent=n+' words · about '+Math.ceil(n/140*60)+' seconds';save('tp-script',editor.value)}editor.addEventListener('input',refresh);refresh();
function draw(){const guidePos=Math.max(15,Math.min(95,Number(prefs.guidePosition)||50));stage.style.setProperty('--guide-position',guidePos+'%');$('guideVertical').value=guidePos;$('guideControl').classList.toggle('hidden',!prefs.sliderVisible);$('guideCorner').classList.toggle('active',prefs.sliderVisible);$('guideCorner').setAttribute('aria-pressed',String(prefs.sliderVisible));script.style.setProperty('--guide-position',guidePos+'svh');stage.classList.toggle('flip-x',prefs.mx);stage.classList.toggle('flip-y',prefs.my);$('guide').classList.toggle('show',prefs.guide);for(const [id,key,title] of [['mx','mx','Mirror X'],['my','my','Mirror Y'],['guideBtn','guide','Guide']]){$(id).textContent=title+': '+(prefs[key]?'On':'Off');$(id).classList.toggle('active',prefs[key])}script.style.fontSize=prefs.font+'px';script.style.width=prefs.width+'%';script.style.lineHeight=prefs.spacing;for(const key of ['speed','font','width','spacing']){$(key).value=prefs[key];$(key+'Value').textContent=prefs[key]}}
$('editToggle').onclick=()=>{const hidden=$('editarea').classList.toggle('collapsed');$('editToggle').textContent=hidden?'Show script editor':'Hide script editor';save('tp-editor-hidden',hidden?'1':'0')};if(read('tp-editor-hidden','0')==='1')$('editToggle').click();$('guideCorner').onclick=()=>{prefs.sliderVisible=!prefs.sliderVisible;persist();draw()};draw();$('guideVertical').oninput=()=>{prefs.guidePosition=Number($('guideVertical').value);persist();draw()};for(const key of ['speed','font','width','spacing'])$(key).oninput=()=>{prefs[key]=Number($(key).value);persist();draw()};
for(const [id,key] of [['mx','mx'],['my','my'],['guideBtn','guide']])$(id).onclick=()=>{prefs[key]=!prefs[key];if(key==='my'){pause();stage.scrollTop=prefs.my?stage.scrollHeight:0}persist();draw()};
function pause(){playing=false;cancelAnimationFrame(frame);last=0;$('play').textContent='▶ Play'}
function adjustSpeed(delta){prefs.speed=Math.max(0,Math.min(240,prefs.speed+delta));persist();draw()}function move(delta){stage.scrollTop+=prefs.my?-delta:delta}function tick(t){if(!playing)return;if(last){const before=stage.scrollTop;move((t-last)/1000*prefs.speed);if(stage.scrollTop===before&&prefs.speed>0)pause()}last=t;if(playing)frame=requestAnimationFrame(tick)}
function toggle(){if(playing)pause();else{playing=true;last=0;$('play').textContent='Ⅱ Pause';frame=requestAnimationFrame(tick)}}

function cameraDimensions(){const [w,h]=cameraPrefs.ratio.split(':').map(Number),short=Number(cameraPrefs.quality);return w>=h?{width:Math.round(short*w/h/2)*2,height:short}:{width:short,height:Math.round(short*h/w/2)*2}}
function updateCameraOptions(){for(const [id,key] of [['videoRatio','ratio'],['videoQuality','quality'],['videoFit','fit']])$(id).value=cameraPrefs[key];$('cameraPreview').classList.toggle('fit',cameraPrefs.fit==='contain');$('cameraFrame').className='r'+cameraPrefs.ratio.replace(':','');for(const id of ['videoRatio','videoQuality','videoFit'])$(id).disabled=recorder?.state==='recording'}
for(const [id,key] of [['videoRatio','ratio'],['videoQuality','quality'],['videoFit','fit']])$(id).onchange=()=>{cameraPrefs[key]=$(id).value;save('tp-video-'+key.replace('ratio','ratio').replace('quality','quality').replace('fit','fit'),cameraPrefs[key]);updateCameraOptions()};updateCameraOptions();
function cameraMessage(msg){$('cameraStatus').textContent=msg}
function cameraUI(){const on=!!cameraStream;$('camera').textContent='Camera: '+(on?'On':'Off');$('camera').classList.toggle('active',on);$('record').disabled=!on||!window.MediaRecorder;$('switchCamera').disabled=!on;$('record').textContent=recorder?.state==='recording'?'■ Stop recording':'● Record';$('record').classList.toggle('active',recorder?.state==='recording')}
async function stopCamera(){if(recorder?.state==='recording')recorder.stop();if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}$('cameraPreview').srcObject=null;document.body.classList.remove('camera-mode');cameraUI();updateCameraOptions()}
async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){cameraMessage('Camera unavailable in this browser or insecure connection');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:{facingMode:{ideal:facing}}});cameraStream=stream;$('cameraPreview').srcObject=stream;document.body.classList.add('camera-mode');cameraMessage('Camera ready. Recording saves video only, not overlaid text.');cameraUI()}catch(err){cameraMessage('Camera access failed: '+(err?.message||err));cameraUI()}}
$('camera').onclick=async()=>{if(cameraStream)await stopCamera();else await startCamera()};
$('switchCamera').onclick=async()=>{if(!cameraStream||recorder?.state==='recording')return;await stopCamera();facing=facing==='user'?'environment':'user';await startCamera()};
$('record').onclick=()=>{if(recorder?.state==='recording'){recorder.stop();cameraUI();return}if(!cameraStream||!window.MediaRecorder)return;const types=['video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];const mime=types.find(t=>MediaRecorder.isTypeSupported(t));try{chunks=[];const dims=cameraDimensions();recordCanvas=document.createElement('canvas');recordCanvas.width=dims.width;recordCanvas.height=dims.height;const ctx=recordCanvas.getContext('2d');if(!ctx||!recordCanvas.captureStream)throw Error('Canvas recording not supported');const paint=()=>{if(!recordCanvas||!cameraStream)return;const v=$('cameraPreview'),vw=v.videoWidth,vh=v.videoHeight;if(vw&&vh){const target=dims.width/dims.height,source=vw/vh;let sx=0,sy=0,sw=vw,sh=vh;if(source>target){sw=vh*target;sx=(vw-sw)/2}else{sh=vw/target;sy=(vh-sh)/2}ctx.drawImage(v,sx,sy,sw,sh,0,0,dims.width,dims.height)}recordFrame=requestAnimationFrame(paint)};paint();recordStream=recordCanvas.captureStream(30);for(const track of cameraStream.getAudioTracks())recordStream.addTrack(track);recorder=new MediaRecorder(recordStream,mime?{mimeType:mime}:undefined);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{cancelAnimationFrame(recordFrame);recordStream?.getVideoTracks().forEach(t=>t.stop());recordStream=null;recordCanvas=null;const type=recorder.mimeType||mime||'video/webm';const blob=new Blob(chunks,{type});chunks=[];if(blob.size){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='teleprompter-'+new Date().toISOString().replace(/[:.]/g,'-')+(type.includes('mp4')?'.mp4':'.webm');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);cameraMessage('Recording finished ('+cameraPrefs.ratio+'). Check your device downloads.')}cameraUI()};recorder.onerror=()=>cameraMessage('Recording error. Check storage and permissions.');recorder.start(1000);cameraMessage('Recording '+cameraPrefs.ratio+' at '+cameraPrefs.quality+'p target. Keep app in foreground.');cameraUI();updateCameraOptions()}catch(err){cancelAnimationFrame(recordFrame);recordStream?.getVideoTracks().forEach(t=>t.stop());recordStream=null;recordCanvas=null;cameraMessage('Recording unavailable: '+(err?.message||err))}};
cameraUI();

$('play').onclick=toggle;$('reset').onclick=()=>{pause();stage.scrollTop=prefs.my?stage.scrollHeight:0};
async function exit(){document.body.classList.remove('present');if(document.fullscreenElement)try{await document.exitFullscreen()}catch{}}
async function fullscreen(){if(document.body.classList.contains('present'))return exit();document.body.classList.add('present');stage.focus({preventScroll:true});if(document.documentElement.requestFullscreen)try{await document.documentElement.requestFullscreen()}catch{}}
$('full').onclick=fullscreen;$('exit').onclick=exit;stage.addEventListener('click',()=>{if(document.body.classList.contains('present'))toggle()});
$('test').onclick=()=>{testing=!testing;$('test').textContent='Remote tester: '+(testing?'On':'Off');$('diagnostic').textContent=testing?'Press a Desview remote button…':''};
document.addEventListener('keydown',e=>{if((e.key==='Unidentified'||e.keyCode===0)&&!testing){e.preventDefault();e.stopPropagation();if(!e.repeat)toggle();return}if(testing){$('diagnostic').textContent='Key: '+JSON.stringify(e.key)+' | code: '+e.code+' | keyCode: '+e.keyCode;e.preventDefault();return}if(e.target===editor||e.target.tagName==='INPUT')return;let handled=true;switch(e.key){case ' ':case 'Enter':case 'MediaPlayPause':toggle();break;case 'ArrowRight':adjustSpeed(5);break;case 'ArrowLeft':adjustSpeed(-5);break;case 'ArrowDown':move(55);break;case 'ArrowUp':move(-55);break;case 'PageDown':move(stage.clientHeight*.55);break;case 'PageUp':move(-stage.clientHeight*.55);break;case 'Home':stage.scrollTop=prefs.my?stage.scrollHeight:0;break;case 'm':case 'M':$('mx').click();break;case 'f':case 'F':fullscreen();break;case 'Escape':exit();break;default:handled=false}if(handled){e.preventDefault();e.stopPropagation()}} ,true);
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('present')});window.addEventListener('pagehide',()=>{pause();if(recorder?.state==='recording')recorder.stop();if(cameraStream)cameraStream.getTracks().forEach(t=>t.stop())});
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
